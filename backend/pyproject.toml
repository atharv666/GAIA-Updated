[project]
name = "gaia-backend"
version = "1.0.0"
description = "GAIA: sensor-grounded RAG chatbot + VLM crop diagnosis backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["postgres: needs the embedded PostgreSQL (pgserver) with pgvector"]

[tool.ruff]
line-length = 120
target-version = "py311"
